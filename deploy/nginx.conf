# 《第九特区》静态站点 Nginx 配置示例
# 用法：把 `npm run build` 生成的 dist/ 内容上传到服务器，
# 放在下面 root 指向的目录，然后 reload nginx。
#
#   scp -r dist/* user@服务器IP:/var/www/ninth-district/
#   sudo nginx -t && sudo nginx -s reload
#
# 直接用服务器公网 IP（http://你的IP）访问即可，无需备案；
# 若要绑定域名 + 80/443，则该域名需要完成 ICP 备案。

server {
    listen 80;
    server_name _;                 # 用域名时改成你的域名

    root /var/www/ninth-district;  # dist/ 内容所在目录
    index index.html;

    # 开启 gzip，显著减小 js/css 传输体积
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 构建产物（带 hash）可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 图片、视频等素材缓存
    location ~* \.(png|jpe?g|webp|gif|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA 路由回退：未命中静态文件的请求统一返回 index.html，
    # 否则刷新 /map、/characters 等子路由会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
